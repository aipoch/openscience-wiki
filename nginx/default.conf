server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve the public HTTPS scheme behind a TLS-terminating proxy.
    absolute_redirect off;

    # Keep the public API stable while serving the multilingual sitemap index.
    location = /sitemap {
        types {}
        default_type application/xml;
        try_files /docs/sitemap-index.xml =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
