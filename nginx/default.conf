server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the public API stable while serving the generated sitemap file.
    location = /sitemap {
        types {}
        default_type application/xml;
        try_files /docs/sitemap.xml =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
